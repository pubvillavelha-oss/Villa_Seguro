<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Villa Seguro — Painel da Equipe</title>
<style>
  :root{--bg:#0f0a1a;--card:#1a1226;--card2:#221735;--texto:#f2ecff;
        --roxo:#8b5cf6;--roxo2:#6d28d9;--laranja:#f97316;--cinza:#9ca3af;
        --verde:#22c55e;--ambar:#f59e0b;--vermelho:#ef4444}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--texto);min-height:100vh}
  .wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px}
  .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
  .header h1{font-size:20px;font-weight:800}
  .header .escudo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--roxo),var(--roxo2));
    display:flex;align-items:center;justify-content:center;font-size:22px}
  .card{background:var(--card);border:1px solid #2b1e42;border-radius:16px;padding:16px;margin-bottom:14px}
  .card h3{font-size:15px;margin-bottom:12px;font-weight:800}
  .rotulo{font-size:12px;color:var(--cinza);margin:12px 0 6px;display:block}
  input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid #2b1e42;
    background:var(--card2);color:var(--texto);font-size:14px;font-family:inherit}
  textarea{resize:vertical;min-height:70px}
  .btn{width:100%;padding:14px;border:none;border-radius:14px;cursor:pointer;font-size:15px;font-weight:800}
  .btn-prim{background:linear-gradient(135deg,var(--roxo),var(--roxo2));color:#fff}
  .btn-verde{background:var(--verde);color:#062b14}
  .btn-sec{background:transparent;border:1px solid #2b1e42;color:var(--texto)}
  .linha{display:flex;gap:10px;margin-top:14px}
  .linha .btn{flex:1}

  /* Fila de ocorrências */
  .ocorrencia{display:flex;justify-content:space-between;align-items:center;background:var(--card);
    border:1px solid #2b1e42;border-left:4px solid var(--cinza);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer}
  .ocorrencia.critica{border-left-color:var(--vermelho)}
  .ocorrencia.alta{border-left-color:var(--laranja)}
  .ocorrencia.media{border-left-color:var(--ambar)}
  .ocorrencia.baixa{border-left-color:var(--cinza)}
  .ocorrencia .cat{font-size:14px;font-weight:700}
  .ocorrencia .meta{font-size:12px;color:var(--cinza);margin-top:3px}
  .badge{padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
  .b-critica{background:rgba(239,68,68,.18);color:var(--vermelho)}
  .b-alta{background:rgba(249,115,22,.18);color:var(--laranja)}
  .b-media{background:rgba(245,158,11,.18);color:var(--ambar)}
  .b-baixa{background:rgba(156,163,175,.18);color:var(--cinza)}
  .b-recebido{background:rgba(245,158,11,.15);color:var(--ambar)}
  .b-analise{background:rgba(139,92,246,.15);color:#c4b5fd}
  .b-resolvido{background:rgba(34,197,94,.15);color:var(--verde)}
  .b-semprocedencia{background:rgba(156,163,175,.15);color:var(--cinza)}
  .vazio{color:var(--cinza);text-align:center;font-size:13px;padding:24px}
  .erro{color:var(--vermelho);font-size:12.5px;margin-top:8px;text-align:center}
  .filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .filtros button{background:var(--card2);border:1px solid #2b1e42;color:var(--texto);border-radius:999px;
    padding:7px 14px;font-size:12.5px;cursor:pointer}
  .filtros button.ativo{border-color:var(--roxo);background:var(--card)}
  .voltar{background:none;border:none;color:var(--texto);font-size:20px;cursor:pointer;padding:4px}
  .topo{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .topo h2{font-size:17px;font-weight:800}
  .detalhe-linha{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #2b1e42;font-size:13.5px}
  .detalhe-linha .k{color:var(--cinza)}
  .detalhe-linha .v{font-weight:700;text-align:right;max-width:60%}
  .link-midia{color:#c4b5fd;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<div class="wrap">

  <!-- ===== LOGIN ===== -->
  <section id="tela-login">
    <div class="card" style="max-width:380px;margin:60px auto">
      <div style="text-align:center;margin-bottom:16px">
        <div class="escudo" style="margin:0 auto 10px">🛡️</div>
        <h3>Painel da Equipe</h3>
        <p style="color:var(--cinza);font-size:12.5px">Acesso restrito à equipe de segurança</p>
      </div>
      <span class="rotulo">Senha</span>
      <input type="password" id="f-senha" placeholder="Digite a senha">
      <button class="btn btn-prim" style="margin-top:14px" onclick="entrar()">Entrar</button>
      <div class="erro" id="erro-login"></div>
    </div>
  </section>

  <!-- ===== LISTA DE OCORRÊNCIAS ===== -->
  <section id="tela-lista" style="display:none">
    <div class="header">
      <div style="display:flex;align-items:center;gap:10px">
        <div class="escudo">🛡️</div>
        <div><h1>Ocorrências</h1><p style="font-size:12px;color:var(--cinza)">Painel da equipe</p></div>
      </div>
      <button class="btn btn-sec" style="width:auto;padding:8px 14px" onclick="sair()">Sair</button>
    </div>
    <div class="filtros" id="filtros">
      <button class="ativo" data-f="todos" onclick="filtrar('todos',this)">Todos</button>
      <button data-f="Recebido" onclick="filtrar('Recebido',this)">Recebidos</button>
      <button data-f="Em análise" onclick="filtrar('Em análise',this)">Em análise</button>
      <button data-f="Resolvido" onclick="filtrar('Resolvido',this)">Resolvidos</button>
      <button data-f="Sem procedência" onclick="filtrar('Sem procedência',this)">Sem procedência</button>
    </div>
    <div id="lista-ocorrencias"></div>
  </section>

  <!-- ===== DETALHE / TRATAMENTO ===== -->
  <section id="tela-detalhe" style="display:none">
    <div class="topo"><button class="voltar" onclick="voltarLista()">←</button><h2>Tratar ocorrência</h2></div>
    <div class="card">
      <div id="detalhe-info"></div>
      <span class="rotulo">Status</span>
      <select id="f-status">
        <option value="Recebido">Recebido</option>
        <option value="Em análise">Em análise</option>
        <option value="Resolvido">Resolvido</option>
        <option value="Sem procedência">Sem procedência</option>
      </select>
      <span class="rotulo">Responsável</span>
      <input id="f-responsavel" type="text" placeholder="Quem atendeu">
      <span class="rotulo">Ação tomada</span>
      <textarea id="f-acao" maxlength="500" placeholder="Descreva a ação realizada..."></textarea>
      <button class="btn btn-verde" style="margin-top:14px" onclick="salvarTratamento()">💾 Salvar tratamento</button>
      <div class="erro" id="erro-tratamento"></div>
    </div>
  </section>

</div>

<script>
/* ====== CONFIG ====== */
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbx7nR8HWULpcxpLxrOfcKtY3oT8g_jmHPJD1p-01KQd60qbFGEhpc30hxmHzbV0ODY/exec'; // mesma URL do frontend
const SENHA = 'villa2026'; // troque pela senha da equipe

/* ====== ESTADO ====== */
let ocorrencias = [];
let filtroAtual = 'todos';
let ocorrenciaAtual = null;

/* ====== LOGIN ====== */
function entrar(){
  const s = document.getElementById('f-senha').value;
  if(s === SENHA){
    sessionStorage.setItem('vs_equipe','ok');
    document.getElementById('tela-login').style.display='none';
    document.getElementById('tela-lista').style.display='block';
    carregarOcorrencias();
  } else {
    document.getElementById('erro-login').textContent='Senha incorreta.';
  }
}
function sair(){
  sessionStorage.removeItem('vs_equipe');
  location.reload();
}
if(sessionStorage.getItem('vs_equipe')==='ok') entrar();

/* ====== CARREGAR OCORRÊNCIAS ====== */
async function carregarOcorrencias(){
  try{
    const resp = await fetch(WEB_APP_URL + '?listar=1');
    const data = await resp.json();
    if(!data.ok) throw new Error(data.erro||'Erro');
    ocorrencias = data.ocorrencias || [];
    renderLista();
  }catch(e){
    document.getElementById('lista-ocorrencias').innerHTML =
      '<div class="erro">Erro ao carregar. Verifique a URL do Web App.</div>';
  }
}

function renderLista(){
  const el = document.getElementById('lista-ocorrencias');
  const lista = filtroAtual==='todos' ? ocorrencias : ocorrencias.filter(o=>o.status===filtroAtual);
  if(!lista.length){ el.innerHTML='<div class="vazio">Nenhuma ocorrência neste filtro.</div>'; return; }
  el.innerHTML = lista.map(o=>`
    <div class="ocorrencia ${o.prioridade.toLowerCase()}" onclick="abrirDetalhe('${o.protocolo}')">
      <div>
        <div class="cat">${o.categoria}</div>
        <div class="meta">${o.protocolo} · ${o.local}${o.mesa?' — Mesa '+o.mesa:''} · ${o.dataHora}</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
        <span class="badge b-${o.prioridade.toLowerCase()}">${o.prioridade}</span>
        <span class="badge b-${o.status.toLowerCase().replace(/[^a-z]/g,'')}">${o.status}</span>
      </div>
    </div>`).join('');
}

function filtrar(f, btn){
  filtroAtual = f;
  document.querySelectorAll('#filtros button').forEach(b=>b.classList.remove('ativo'));
  btn.classList.add('ativo');
  renderLista();
}

/* ====== DETALHE ====== */
function abrirDetalhe(protocolo){
  ocorrenciaAtual = ocorrencias.find(o=>o.protocolo===protocolo);
  if(!ocorrenciaAtual) return;
  const o = ocorrenciaAtual;
  document.getElementById('detalhe-info').innerHTML = `
    <div class="detalhe-linha"><span class="k">Protocolo</span><span class="v">${o.protocolo}</span></div>
    <div class="detalhe-linha"><span class="k">Categoria</span><span class="v">${o.categoria}</span></div>
    <div class="detalhe-linha"><span class="k">Prioridade</span><span class="v">${o.prioridade}</span></div>
    <div class="detalhe-linha"><span class="k">Local</span><span class="v">${o.local}${o.mesa?' — Mesa '+o.mesa:''}</span></div>
    <div class="detalhe-linha"><span class="k">Recebido em</span><span class="v">${o.dataHora}</span></div>
    <div class="detalhe-linha"><span class="k">Descrição</span><span class="v">${o.descricao||'—'}</span></div>
    ${o.midia?`<div class="detalhe-linha"><span class="k">Mídia</span><span class="v"><a class="link-midia" href="${o.midia}" target="_blank">Ver anexo ↗</a></span></div>`:''}
  `;
  document.getElementById('f-status').value = o.status;
  document.getElementById('f-responsavel').value = o.responsavel||'';
  document.getElementById('f-acao').value = o.acao||'';
  document.getElementById('erro-tratamento').textContent='';
  document.getElementById('tela-lista').style.display='none';
  document.getElementById('tela-detalhe').style.display='block';
}

function voltarLista(){
  document.getElementById('tela-detalhe').style.display='none';
  document.getElementById('tela-lista').style.display='block';
  carregarOcorrencias();
}

/* ====== SALVAR TRATAMENTO (F03) ====== */
async function salvarTratamento(){
  const o = ocorrenciaAtual;
  const payload = {
    acao:'atualizar',
    protocolo: o.protocolo,
    status: document.getElementById('f-status').value,
    responsavel: document.getElementById('f-responsavel').value,
    acaoTomada: document.getElementById('f-acao').value
  };
  try{
    const resp = await fetch(WEB_APP_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(payload)});
    const data = await resp.json();
    if(!data.ok) throw new Error(data.erro||'Erro');
    alert('Ocorrência atualizada!');
    voltarLista();
  }catch(e){
    document.getElementById('erro-tratamento').textContent='Erro ao salvar: '+e.message;
  }
}
</script>
</body>
</html>
